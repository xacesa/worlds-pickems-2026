name: Täglicher Pick'em-Datenabgleich
# PEM.LOL currently returns HTTP 403 to GitHub Actions runners.
# This legacy workflow is manual-only until a permitted data endpoint is available.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pickems-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt
      - name: PEM.LOL abrufen
        run: python sync_pem.py
      - name: Ergebnisse aktualisieren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json
          if ! git diff --cached --quiet; then
            git commit -m "Update PEM.LOL Worlds 2026 results"
            git push
          fi
